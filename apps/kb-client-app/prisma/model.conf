[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# Generic matcher supporting:
# 1. Direct role/user match: g(r.sub.id, p.sub)
# 2. Resource matching: r.obj == p.obj
# 3. Action matching: r.act == p.act
# 4. ABAC: Evaluating custom attributes (e.g. r.sub.clearance >= r.obj.requiredClearance)
# Note: r.sub, r.obj, r.act are objects in ABAC mode.
m = g(r.sub.id, p.sub) && r.obj.type == p.obj && r.act == p.act \
    || r.sub.role == "admin"

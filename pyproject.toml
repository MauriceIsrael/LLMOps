[tool.poetry]
name = "llmops-graphrag-mcp"
version = "0.1.0"
description = "Plateforme LLMOps Neuro-Symbolique d'Architecture (GraphRAG + Kùzu DB + FastMCP + DeepEval)"
authors = ["LLMOps Team <admin@llmops.local>"]
readme = "README.md"
packages = [
    { include = "mcp_server" },
    { include = "pipelines" },
    { include = "tools" }
]

[tool.poetry.dependencies]

python = "^3.11"
fastmcp = "^0.4.1"
ladybug = ">=0.1.0"
llama-index-core = ">=0.11.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
python-dotenv = "^1.0.1"
typer = ">=0.15.0"
click = "<8.2.0"
rich = "^13.7.0"
pyyaml = "^6.0.1"
deepeval = ">=1.4.0"
langgraph = "^1.2.9"
langgraph-checkpoint-sqlite = "^3.1.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^6.0"
ruff = "^0.4.0"
mypy = "^1.9.0"
mutmut = "^3.2.0"

[tool.poetry.scripts]
ingest = "pipelines.cli:ingest_main"
visualize = "pipelines.cli:visualize_main"
mcp-server = "mcp_server.main:main"
mcp-server-knowledge = "mcp_server.main_knowledge:main"
mcp-server-engagement = "mcp_server.main_engagement:main"
elicit = "tools.elicitation.cli:main"




[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "Arborescence exemple",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E402", "E501", "E702", "UP009", "W291", "W293"]





[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "deterministic: oracle de migration — aucun appel LLM, résultat reproductible",
    "stochastic: extraction LLM, DeepEval, Promptfoo — non utilisable comme oracle",
]

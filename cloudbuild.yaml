substitutions:
  _TAG: 'latest'

steps:
  # 1. Builder l'image Docker de mcp_server
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/llmops/mcp-server:${_TAG}'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/llmops/mcp-server:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # 2. Pousser l'image vers GCP Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/llmops/mcp-server:${_TAG}'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/llmops/mcp-server:latest'

  # 3. Déployer l'application sur GCP Cloud Run avec GRAPH_BACKEND=ladybug
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'llmops-mcp-server'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/llmops/mcp-server:${_TAG}'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--max-instances=2'
      - '--min-instances=0'
      - '--concurrency=20'
      - '--timeout=30s'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--set-env-vars'
      - 'GRAPH_BACKEND=ladybug,LLMOPS_TRANSPORT=sse,LLMOPS_PLANE=knowledge'
      - '--set-secrets'
      - 'SERVER_TOKEN=llmops-demo-token:latest'
      - '--port'
      - '8000'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/llmops/mcp-server:${_TAG}'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/llmops/mcp-server:latest'

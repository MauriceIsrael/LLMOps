# Jeu d'évaluation de la recherche sémantique multilingue (issue #94, lot E5).
#
# Chaque cas : un sujet d'architecture rédigé comme dans un appel d'offres (en français, sauf la famille « en »
# qui garde les requêtes anglaises existantes pour vérifier l'absence de régression), et les identifiants de la base
# (data/kb) qu'un architecte attend en tête de la doctrine applicable.
#
# - `frameworks` (facultatif) : référentiels déclarés pour le sujet. Le rappel est alors mesuré parmi les contrôles
#   imposés de ces référentiels (ce que voit Archinex sous « imposé par les référentiels », trié par pertinence).
#   Sans `frameworks`, il est mesuré sur toute la doctrine active (principes, patterns, décisions, contrôles).
# - `expected` : au moins un identifiant ; le rappel à 5 est la part des identifiants attendus classés dans les 5
#   premiers.
#
# Anonymisé : aucun nom de client, d'opérateur, de site ni de programme.
version: 1
cases:

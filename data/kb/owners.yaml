# Domain owners of the knowledge base: who reviews a KB candidate (plan L2, §5.5).
#
# - `owners`: one entry per owner handle (consistent with data/kb/CODEOWNERS), with the
#   notification channels used when a candidate enters review (`kb remind` for reminders):
#   `email` (SMTP, disabled by default), optional `discord_webhook` and `ntfy_topic`.
#   Channels left empty are not used. TODO(maintainers): fill in the real e-mail addresses.
# - `domains`: owner of each domain used by an asset (a sub-domain `parent/child` inherits
#   the owner of `parent` unless it has its own entry). tests/unit/test_kb_owners.py checks
#   that every domain used in data/kb has an owner.
# - `default_owner`: fallback when a candidate has no owned domain.

default_owner: "@maintainers"

owners:
  "@3gpp-conformance-wg":
    email: null
    discord_webhook: null
    ntfy_topic: null

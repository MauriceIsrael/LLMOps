id: BLU-hla-mcx
title: High-level solution architecture — mission-critical mobile network
version: 2
status: active
confidence: verified
owner: core-owner-architecture
last_reviewed: 2026-07-27
compliance_targets:
  - NIS2
  - 3GPP
  - SecNumCloud
  - ISO27001
derived_from:
  - HLA_Mission_Critical_Mobile_Network_Structure.docx — 44 subsections, titles verbatim
  - the NetDevOps and Dark NOC architecture designed for the same system

notes: >-
  Section identifiers and titles follow the bid template exactly. Five
  sub-subsections carry `added_by_engagement: true`: they hold design work this
  engagement produced which the template has no home for. Nothing else deviates,
  and nothing outside this file should depend on the numbering.

  `roots` are created at `L0_named` when the blueprint is bound. Every other
  subject is expected to be discovered by a decomposition; a section requiring
  one of them holds until it exists, which is how the dependency between sections
  becomes visible rather than assumed.

  Sections marked `instructed: false` belong to other programmes. They appear in
  coverage so that the deliverable is complete, and generate no question.

roots:
  - name: engagement-scope
    definition: What is being built, for whom, and where the boundaries fall.
  - name: mcx-services
    definition: The 3GPP mission-critical service layer delivered to end users.
  - name: mobile-core
    definition: The mobile core network and its bearers.
  - name: transport
    definition: The IP underlay serving every hosting domain.
  - name: radio-access
    definition: The radio access layer.
    instructed: false
  - name: device-fleet
    definition: Terminals, accessories and their management.
    instructed: false
  - name: location-services
    definition: Location and geographic information services.
    instructed: false
  - name: rancher-domain
    definition: The container platform operated by the project.
  - name: observation
    definition: How the system is observed, across service and platform signals.
  - name: automation-chain
    definition: The chain that configures, verifies and restores the system.
  - name: service-management
    definition: Order management, assurance, inventory and the configuration database.
  - name: security-posture
    definition: Zoning, identity, cryptography and accreditation.
  - name: ai-assistance
    definition: The advisory assistant layer, optional at run time.
  - name: delivery-plan
    definition: Phasing, effort and the risks carried.
  - name: sim-esim-lifecycle
    definition: Subscriber identity module lifecycle, state and provisioning.


name: CI - Code Quality & Unit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run Ruff Linter
        run: poetry run ruff check .

      - name: Run ADR-0015 Migration & Publish Reference Engagement
        env:
          GRAPH_BACKEND: ladybug
        run: |
          poetry run python -m pipelines.ingestion.migrate_adr0015
          poetry run elicit publish --engagement nordwave-mcx-2027

      - name: Run Unit & Integration Tests
        env:
          GRAPH_BACKEND: ladybug
        run: poetry run pytest tests/contract tests/unit tests/integration -v

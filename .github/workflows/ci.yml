name: CI - Code Quality & Unit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for absolute file:/// links in Markdown files
        run: |
          if git grep -n "file:///" -- "*.md"; then
            echo "ERROR: Absolute file:/// links found in versioned Markdown files!"
            exit 1
          fi

      - name: Check Demo Token Consistency in Documentation
        run: |
          TOKEN="demo-public-2026-08"
          for file in README.md README.fr.md docs/user_manual.md docs/renderer_integration.md; do
            if ! grep -q "$TOKEN" "$file"; then
              echo "ERROR: Demo token '$TOKEN' missing from $file!"
              exit 1
            fi
          done
          echo "✅ Public demo token consistency verified across documentation."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run Ruff Linter
        run: poetry run ruff check .

      - name: Run Mypy Type Checker
        run: poetry run mypy mcp_server tools pipelines

      - name: Run ADR-0015 Migration & Publish Reference Engagement
        env:
          GRAPH_BACKEND: ladybug
        run: |
          poetry run python -m pipelines.ingestion.migrate_adr0015
          poetry run elicit publish --engagement nordwave-mcx-2027

      - name: Run Unit & Integration Tests
        env:
          GRAPH_BACKEND: ladybug
        run: poetry run pytest tests/contract tests/unit tests/integration -v

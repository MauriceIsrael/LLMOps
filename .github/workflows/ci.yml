name: CI - Code Quality & Unit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for absolute file:/// links in Markdown files
        run: |
          if git grep -n "file:///" -- "*.md"; then
            echo "ERROR: Absolute file:/// links found in versioned Markdown files!"
            exit 1
          fi

      - name: Check Demo Token Consistency in Documentation
        run: |
          TOKEN="demo-public-2026-08"
          for file in README.md README.fr.md docs/user_manual.md docs/renderer_integration.md; do
            if ! grep -q "$TOKEN" "$file"; then
              echo "ERROR: Demo token '$TOKEN' missing from $file!"
              exit 1
            fi
          done
          echo "✅ Public demo token consistency verified across documentation."

      - name: Check Deployment Plane Consistency in Documentation
        run: |
          PLANE_IN_CLOUDBUILD=$(grep -o "LLMOPS_PLANE=[a-z]*" cloudbuild.yaml | cut -d= -f2)
          echo "Detected LLMOPS_PLANE in cloudbuild.yaml: $PLANE_IN_CLOUDBUILD"
          if ! grep -q "LLMOPS_PLANE=$PLANE_IN_CLOUDBUILD" SECURITY.md; then
            echo "ERROR: SECURITY.md does not document the active deployment plane '$PLANE_IN_CLOUDBUILD' configured in cloudbuild.yaml!"
            exit 1
          fi
          echo "✅ Deployment plane consistency verified between cloudbuild.yaml and SECURITY.md."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run Ruff Linter
        run: poetry run ruff check .

      - name: Run Mypy Type Checker
        run: poetry run mypy mcp_server tools pipelines

      - name: Run ADR-0015 Migration & Publish Reference Engagement
        env:
          GRAPH_BACKEND: ladybug
        run: |
          poetry run python -m pipelines.ingestion.migrate_adr0015
          poetry run elicit publish --engagement nordwave-mcx-2027

      - name: Run Unit & Integration Tests
        env:
          GRAPH_BACKEND: ladybug
        run: poetry run pytest tests/contract tests/unit tests/integration -v

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/kb-client-app/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm --prefix apps/kb-client-app ci --legacy-peer-deps

      - name: Run SvelteKit Type & Syntax Check
        run: npm --prefix apps/kb-client-app run check

      - name: Run Frontend Production Build
        run: npm --prefix apps/kb-client-app run build

  security-secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

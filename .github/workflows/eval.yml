name: Semantic Evals & Non-Regression

on:
  schedule:
    - cron: '0 2 * * 0' # Hebdomadaire (dimanche à 2h du matin)
  workflow_dispatch:

env:
  DEMO_ENGAGEMENT_ID: demo-engagement-2027

jobs:
  run-evals:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-

      - name: Install dependencies (including eval group)
        run: poetry install --no-interaction --with eval

      - name: Ingest KB and migrate databases locally for evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GRAPH_BACKEND: ladybug
        run: |
          poetry run python -m pipelines.ingestion.migrate_adr0015
          poetry run elicit publish --engagement ${{ env.DEMO_ENGAGEMENT_ID }}

      - name: Run ADR Benchmark & Evaluation Harness
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GRAPH_BACKEND: ladybug
        run: |
          poetry run python tests/bench/harness.py
          poetry run pytest tests/bench/test_bench.py -v

      - name: Run DeepEval Semantic Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GRAPH_BACKEND: ladybug
        run: poetry run deepeval test run tests/evals/semantic/test_semantic_regression.py

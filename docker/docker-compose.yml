version: '3.8'

services:
  ingestion-pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pipeline
    volumes:
      - kuzu_data:/app/data
      - ../data/kb:/app/data/kb
    environment:
      # Optional: OPENAI_API_KEY is only required for running DeepEval benchmarks in tests/evals/
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

  mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    depends_on:
      ingestion-pipeline:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - kuzu_data:/app/data
    environment:
      # Optional: OPENAI_API_KEY is only required for running DeepEval benchmarks
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SERVER_TOKEN=${SERVER_TOKEN:-llmops-dev-token-2026}
      - GRAPH_BACKEND=${GRAPH_BACKEND:-ladybug}
      - LLMOPS_TRANSPORT=sse
      - PORT=8000
    restart: unless-stopped

volumes:
  kuzu_data:
